name: Probe advertiser MP capability

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run probe
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          cat > mp_adv_probe.php << 'PHP'
          <?php
          header('Content-Type: application/json; charset=utf-8');
          require_once __DIR__ . '/plugin/linkconnect/_common.php';
          $out = array('ok'=>true,'local'=>lc_mp_local_platform_code(),'enabled'=>lc_mp_enabled());
          $cp = lc_table('campaigns');
          $cv = lc_table('conversions');
          $out['campaigns']=array();
          foreach (array('CPA-BANKTUPT','CPA-00011') as $code) {
            $c = sql_fetch("SELECT cp_id, cp_code, cp_name, mt_id, cp_status FROM `{$cp}` WHERE cp_code='".lc_sql_escape($code)."' LIMIT 1");
            if (!$c) { $out['campaigns'][]=array('code'=>$code,'found'=>false); continue; }
            $mt=(int)$c['mt_id'];
            $cnt = sql_fetch("SELECT COUNT(*) c FROM `{$cv}` WHERE cp_id='".(int)$c['cp_id']."'");
            $recent = array();
            $r = sql_query("SELECT cv_id, cv_code, cv_status, cv_channel, cv_sub_id, pt_id, cv_created_at FROM `{$cv}` WHERE cp_id='".(int)$c['cp_id']."' ORDER BY cv_id DESC LIMIT 5", false);
            while ($r && ($row=sql_fetch_array($r))) {
              $recent[] = array(
                'cvId'=>(int)$row['cv_id'],'code'=>$row['cv_code'],'status'=>$row['cv_status'],
                'channel'=>$row['cv_channel'],'ptId'=>(int)$row['pt_id'],'created'=>$row['cv_created_at'],
              );
            }
            $out['campaigns'][] = array(
              'code'=>$code,'cpId'=>(int)$c['cp_id'],'mtId'=>$mt,'status'=>$c['cp_status'],
              'conversionCount'=>(int)($cnt['c']??0),
              'isManagementLocal'=>lc_mp_local_is_management_for_mt($mt),
              'wouldPushOnCreate'=>(!lc_mp_local_is_management_for_mt($mt) && function_exists('lc_mp_on_local_conversion_created')),
              'recent'=>$recent,
            );
          }
          $mem=lc_mp_db_table('advertiser_memberships'); $grp=lc_mp_db_table('advertiser_groups'); $plat=lc_mp_db_table('platforms');
          $out['memberships']=array();
          $r=sql_query("SELECT g.group_code, p.platform_code, m.local_mt_id, m.external_advertiser_id, m.external_campaign_id, m.status
            FROM `{$mem}` m JOIN `{$grp}` g ON g.group_id=m.group_id JOIN `{$plat}` p ON p.platform_id=m.platform_id
            WHERE g.group_code IN ('AG-BANKTUPT','AG-DASIBOM') ORDER BY g.group_code, p.platform_code", false);
          while($r && ($row=sql_fetch_array($r))){
            $out['memberships'][]=$row;
          }
          $out['hooks']=array(
            'onCreated'=>function_exists('lc_mp_on_local_conversion_created'),
            'onStatus'=>function_exists('lc_mp_on_local_conversion_status_changed'),
            'ensureLocal'=>function_exists('lc_mp_ensure_local_conversion_for_lead'),
            'pushInbound'=>function_exists('lc_mp_adapter_push_inbound_lead'),
            'pushStatus'=>function_exists('lc_mp_adapter_push_status'),
          );
          $peerCode = (lc_mp_local_platform_code()==='ONOFFCPA') ? 'LINKCONNECT' : 'ONOFFCPA';
          $peer = lc_mp_get_platform_by_code($peerCode);
          $out['peer']=array('code'=>$peerCode,'apiBase'=>$peer['api_base_url']??'','hasWh'=>!empty($peer['webhook_secret']),'hasTok'=>!empty($peer['outbound_token']));
          if (!empty($peer['api_base_url'])) {
            $url=rtrim($peer['api_base_url'],'/').'/plugin/linkconnect/api/platform/health.php';
            $ch=curl_init($url); curl_setopt_array($ch,array(CURLOPT_RETURNTRANSFER=>1,CURLOPT_TIMEOUT=>8,CURLOPT_SSL_VERIFYPEER=>1));
            $body=curl_exec($ch); $http=(int)curl_getinfo($ch,CURLINFO_HTTP_CODE); curl_close($ch);
            $out['peerHealth']=array('http'=>$http,'ok'=>$http===200 && strpos((string)$body,'"ok"')!==false,'body'=>substr((string)$body,0,160));
          }
          $leads=lc_mp_db_table('lead_refs');
          $out['leadRefTotal']=0;
          if (lc_db_table_exists($leads)) {
            $t=sql_fetch("SELECT COUNT(*) c FROM `{$leads}`");
            $out['leadRefTotal']=(int)($t['c']??0);
            $samples=array();
            $rr=sql_query("SELECT external_lead_id, local_cv_id, status, sync_status, source_platform_id FROM `{$leads}` ORDER BY lead_ref_id DESC LIMIT 5", false);
            while($rr && ($lr=sql_fetch_array($rr))){
              $src=sql_fetch("SELECT platform_code FROM `{$plat}` WHERE platform_id='".(int)$lr['source_platform_id']."'");
              $samples[]=array('ext'=>$lr['external_lead_id'],'localCv'=>(int)$lr['local_cv_id'],'status'=>$lr['status'],'sync'=>$lr['sync_status'],'source'=>$src['platform_code']??'');
            }
            $out['leadRefSamples']=$samples;
          }
          echo json_encode($out, JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT);
          PHP
          curl --fail --silent --show-error --ftp-create-dirs \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            -T mp_adv_probe.php \
            "ftp://${FTP_SERVER}:${FTP_PORT}/public_html/mp_adv_probe.php"
          echo "=== PROBE ==="
          curl -sS --max-time 60 "https://onoffcpa.icrm.co.kr/mp_adv_probe.php" || true
          echo
          curl --silent --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            -Q "DELE /public_html/mp_adv_probe.php" \
            "ftp://${FTP_SERVER}:${FTP_PORT}/" || true
