name: Probe FTP domain roots
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List account roots and domain hints
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          curl -sS --user "${FTP_USERNAME}:${FTP_PASSWORD}" "ftp://${FTP_SERVER}:${FTP_PORT}/" || true
          echo "===="
          curl -sS --user "${FTP_USERNAME}:${FTP_PASSWORD}" "ftp://${FTP_SERVER}:${FTP_PORT}/../" || true
          echo "==== PUBLIC_HTML LIST ===="
          curl -sS --list-only --user "${FTP_USERNAME}:${FTP_PASSWORD}" "ftp://${FTP_SERVER}:${FTP_PORT}/public_html/" | head -40
          echo "==== LOOK FOR DOMAIN CONF ===="
          for p in domains.conf .domains domain.txt ssl.conf public_html/.htaccess; do
            echo "-- $p"
            curl -sS --user "${FTP_USERNAME}:${FTP_PASSWORD}" "ftp://${FTP_SERVER}:${FTP_PORT}/$p" 2>&1 | head -5 || true
          done
