name: Probe MP status
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Upload and run MP status probe
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          SITE_BASE: ${{ vars.SITE_BASE }}
        run: |
          set -euo pipefail
          BASE_HINT="${SITE_BASE:-https://onoffcpa.icrm.co.kr}"
          cat > mp_status_probe.php << 'EOF'
          <?php
          header('Content-Type: application/json; charset=utf-8');
          require_once __DIR__ . '/plugin/linkconnect/_common.php';
          $out = array(
            'ok' => true,
            'local' => function_exists('lc_mp_local_platform_code') ? lc_mp_local_platform_code() : null,
            'enabled' => function_exists('lc_mp_enabled') ? lc_mp_enabled() : null,
            'schemaReady' => false,
            'platforms' => array(),
            'outbox' => array(),
            'groups' => array(),
            'peerReachable' => null,
            'resolvedOnOffBase' => null,
          );
          if (function_exists('lc_mp_db_ensure_schema')) {
            $sch = lc_mp_db_ensure_schema();
            $out['schemaReady'] = !empty($sch['ok']);
          }
          $plat = function_exists('lc_mp_db_table') ? lc_mp_db_table('platforms') : '';
          if ($plat && function_exists('lc_db_table_exists') && lc_db_table_exists($plat)) {
            $r = sql_query("SELECT platform_code, is_local, status, api_base_url,
              (outbound_token<>'') AS has_out, (webhook_secret<>'') AS has_wh
              FROM `{$plat}` ORDER BY platform_id", false);
            while ($r && ($row = sql_fetch_array($r))) {
              $out['platforms'][] = array(
                'code' => $row['platform_code'],
                'local' => (int)$row['is_local'],
                'status' => $row['status'],
                'apiBase' => $row['api_base_url'],
                'hasOutboundToken' => (int)$row['has_out'] === 1,
                'hasWebhookSecret' => (int)$row['has_wh'] === 1,
              );
            }
          }
          $ob = function_exists('lc_mp_db_table') ? lc_mp_db_table('sync_outbox') : '';
          if ($ob && lc_db_table_exists($ob)) {
            $r = sql_query("SELECT status, COUNT(*) c FROM `{$ob}` GROUP BY status", false);
            while ($r && ($row = sql_fetch_array($r))) {
              $out['outbox'][$row['status']] = (int)$row['c'];
            }
            $dead = sql_fetch("SELECT COUNT(*) c FROM `{$ob}` WHERE status='dead'");
            $failed = sql_fetch("SELECT COUNT(*) c FROM `{$ob}` WHERE status='failed'");
            $pending = sql_fetch("SELECT COUNT(*) c FROM `{$ob}` WHERE status='pending'");
            $out['outboxSummary'] = array(
              'pending' => (int)($pending['c'] ?? 0),
              'failed' => (int)($failed['c'] ?? 0),
              'dead' => (int)($dead['c'] ?? 0),
            );
          }
          $grp = function_exists('lc_mp_db_table') ? lc_mp_db_table('advertiser_groups') : '';
          $pol = function_exists('lc_mp_db_table') ? lc_mp_db_table('management_policies') : '';
          if ($grp && lc_db_table_exists($grp)) {
            $r = sql_query("SELECT g.group_code, g.display_name, p.platform_code AS mgmt
              FROM `{$grp}` g
              LEFT JOIN `{$pol}` mp ON mp.group_id = g.group_id
              LEFT JOIN `{$plat}` p ON p.platform_id = mp.management_platform_id
              WHERE g.group_code IN ('AG-BANKTUPT','AG-DASIBOM')
              ORDER BY g.group_code", false);
            while ($r && ($row = sql_fetch_array($r))) {
              $out['groups'][] = array(
                'code' => $row['group_code'],
                'name' => $row['display_name'],
                'management' => $row['mgmt'],
              );
            }
            if (!$r) {
              $out['groupsError'] = function_exists('lc_sql_error') ? lc_sql_error() : 'query failed';
              // fallback: list all groups
              $r2 = sql_query("SELECT group_code, display_name, status FROM `{$grp}` ORDER BY group_id LIMIT 20", false);
              while ($r2 && ($row = sql_fetch_array($r2))) {
                $out['allGroups'][] = array('code'=>$row['group_code'],'name'=>$row['display_name'],'status'=>$row['status']);
              }
            }
          }
          if (function_exists('lc_mp_resolve_onoffcpa_base_url')) {
            $out['resolvedOnOffBase'] = lc_mp_resolve_onoffcpa_base_url(4);
          }
          // peer reachability from this host
          foreach ($out['platforms'] as $p) {
            if ((int)$p['local'] === 1) continue;
            $base = trim((string)$p['apiBase']);
            if ($base === '') continue;
            $url = rtrim($base, '/') . '/plugin/linkconnect/api/platform/health.php';
            $ch = curl_init($url);
            curl_setopt_array($ch, array(
              CURLOPT_RETURNTRANSFER => true,
              CURLOPT_TIMEOUT => 8,
              CURLOPT_CONNECTTIMEOUT => 4,
              CURLOPT_SSL_VERIFYPEER => true,
            ));
            $body = curl_exec($ch);
            $http = (int)curl_getinfo($ch, CURLINFO_HTTP_CODE);
            $err = curl_error($ch);
            curl_close($ch);
            $out['peerReachable'] = array(
              'target' => $p['code'],
              'url' => $url,
              'http' => $http,
              'ok' => ($http >= 200 && $http < 300 && is_string($body) && strpos($body, '"ok"') !== false),
              'error' => $err,
              'body' => is_string($body) ? substr($body, 0, 200) : '',
            );
          }
          echo json_encode($out, JSON_UNESCAPED_UNICODE | JSON_PRETTY_PRINT);
          EOF

          curl --fail --silent --show-error --ftp-create-dirs \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            -T mp_status_probe.php \
            "ftp://${FTP_SERVER}:${FTP_PORT}/public_html/mp_status_probe.php"

          # resolve live base for THIS FTP account's site
          REPO="${GITHUB_REPOSITORY##*/}"
          if [ "$REPO" = "linkconnect" ]; then
            CANDS=("https://linkconnect.co.kr")
          else
            CANDS=("https://onoffcpa.icrm.co.kr" "https://onoffcpa.iwinv.net")
          fi
          BASE=""
          for CAND in "${CANDS[@]}"; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 12 \
              "${CAND}/plugin/linkconnect/api/platform/health.php" || echo 000)
            echo "probe ${CAND} -> ${CODE}"
            if [ "$CODE" = "200" ]; then BASE="$CAND"; break; fi
          done
          if [ -z "$BASE" ]; then echo "No reachable base"; exit 1; fi
          echo "BASE=$BASE"
          echo "=== MP STATUS ==="
          curl -sS --max-time 60 "${BASE}/mp_status_probe.php" || true
          echo
          curl --silent --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            -Q "DELE /public_html/mp_status_probe.php" \
            "ftp://${FTP_SERVER}:${FTP_PORT}/" || true
