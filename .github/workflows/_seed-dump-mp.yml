name: Seed and dump MP

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: seed+dump
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          cat > seed_dump.php << 'PHP'
          <?php
          header('Content-Type: application/json; charset=utf-8');
          require_once __DIR__ . '/plugin/linkconnect/_common.php';
          if (!function_exists('lc_mp_seed_personal_rehab_pair')) {
            require_once G5_PLUGIN_PATH . '/linkconnect/install/seed_personal_rehab_mp.php';
          }
          $seed = lc_mp_seed_personal_rehab_pair();
          $mem = lc_mp_db_table('advertiser_memberships');
          $grp = lc_mp_db_table('advertiser_groups');
          $plat = lc_mp_db_table('platforms');
          $pol = lc_mp_db_table('management_policies');
          $cols = array();
          $cr = sql_query("SHOW COLUMNS FROM `{$mem}`", false);
          while ($cr && ($c = sql_fetch_array($cr))) { $cols[] = $c['Field']; }
          $memberships = array();
          $r = sql_query("SELECT m.membership_id, g.group_code, p.platform_code, m.local_mt_id, m.external_merchant_id, m.external_merchant_code, m.status
            FROM `{$mem}` m
            JOIN `{$grp}` g ON g.group_id = m.group_id
            JOIN `{$plat}` p ON p.platform_id = m.platform_id
            WHERE g.group_code IN ('AG-BANKTUPT','AG-DASIBOM')
            ORDER BY g.group_code, p.platform_code", false);
          while ($r && ($row = sql_fetch_array($r))) { $memberships[] = $row; }
          $groups = array();
          $r = sql_query("SELECT g.group_code, g.display_name, p.platform_code AS mgmt
            FROM `{$grp}` g
            LEFT JOIN `{$pol}` mp ON mp.group_id = g.group_id
            LEFT JOIN `{$plat}` p ON p.platform_id = mp.management_platform_id
            WHERE g.group_code IN ('AG-BANKTUPT','AG-DASIBOM')", false);
          while ($r && ($row = sql_fetch_array($r))) { $groups[] = $row; }
          echo json_encode(array(
            'local' => lc_mp_local_platform_code(),
            'seedOk' => !empty($seed['ok']),
            'seed' => $seed,
            'memCols' => $cols,
            'memberships' => $memberships,
            'groups' => $groups,
          ), JSON_UNESCAPED_UNICODE | JSON_PRETTY_PRINT);
          PHP
          curl --fail --silent --show-error --ftp-create-dirs \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            -T seed_dump.php \
            "ftp://${FTP_SERVER}:${FTP_PORT}/public_html/seed_dump.php"
          echo "=== DUMP ==="
          curl -sS --max-time 90 "https://onoffcpa.icrm.co.kr/seed_dump.php" || true
          echo
          curl --silent --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            -Q "DELE /public_html/seed_dump.php" \
            "ftp://${FTP_SERVER}:${FTP_PORT}/" || true
