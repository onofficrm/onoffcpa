name: MP outbox sync

# 다중 플랫폼 동기화 큐(outbox) 워커를 주기 호출한다.
# 호스팅에 셸 접근이 없어 서버 crontab 대신 GitHub Actions 스케줄을 사용.
# 토큰은 mp-cron-setup.yml 로 서버 DB 에 심어둔 값과 동일한 시크릿을 쓴다.

on:
  schedule:
    # GitHub 스케줄은 최소 5분 간격이며 부하에 따라 지연될 수 있다.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  # 실행이 겹쳐 같은 큐를 동시에 처리하지 않도록 직렬화
  group: mp-outbox-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Process outbox
        env:
          MP_CRON_TOKEN: ${{ secrets.MP_CRON_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${MP_CRON_TOKEN}" ]; then
            echo "MP_CRON_TOKEN secret is empty — run mp-cron-setup first"; exit 1
          fi

          BODY=$(mktemp)
          CODE=$(curl -sS --max-time 120 --retry 2 --retry-delay 10 \
            -o "$BODY" -w '%{http_code}' \
            -H "X-LC-Cron-Token: ${MP_CRON_TOKEN}" \
            "https://onoffcpa.iwinv.net/plugin/linkconnect/cron/platform_sync_outbox.php?limit=50") || CODE=000

          echo "HTTP ${CODE}"
          cat "$BODY"; echo

          if [ "$CODE" != "200" ]; then
            echo "::error::outbox worker returned HTTP ${CODE}"
            exit 1
          fi
          if grep -q '"ok":false' "$BODY"; then
            echo "::error::outbox worker reported failure"
            exit 1
          fi
          # dead 건이 생기면 관리자 알림이 별도로 발송되지만, 실행 로그에도 남긴다.
          if grep -qE '"dead":[1-9]' "$BODY"; then
            echo "::warning::동기화 포기(dead) 건이 발생했습니다. 관리자센터 확인 필요."
          fi
