name: Provision Content S2S credential

# LIVE-5C.2 — machine credential + clients.local.php (workflow_dispatch only)
# Secrets: FTP_*, CONTENT_BFF_SSH_KEY, CONTENT_BFF_HOST, CONTENT_BFF_USER (optional, default root)

on:
  workflow_dispatch:
    inputs:
      pt_id:
        description: 'Active partner pt_id (0 = auto-select first active)'
        required: false
        default: '0'
        type: string

concurrency:
  group: onoffcpa-provision-content-s2s
  cancel-in-progress: true

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit active partners (temporary script)
        id: partners
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          PT_INPUT: ${{ github.event.inputs.pt_id }}
        run: |
          set -euo pipefail
          cat > /tmp/audit_content_s2s_partners.php << 'EOF'
          <?php
          header('Content-Type: application/json; charset=utf-8');
          require_once __DIR__ . '/plugin/linkconnect/_common.php';
          if (!function_exists('lc_db_installed') || !lc_db_installed()) {
              echo json_encode(array('ok' => false, 'code' => 'DB_NOT_READY'));
              exit;
          }
          $table = lc_table('partners');
          $active = lc_sql_escape(LC_PARTNER_STATUS_ACTIVE);
          $sql = "SELECT pt_id, pt_code, pt_name, pt_status FROM `{$table}` WHERE pt_status = '{$active}' ORDER BY pt_id ASC";
          $out = array();
          $result = lc_sql_query($sql, false);
          if ($result) {
              while ($row = sql_fetch_array($result)) {
                  $out[] = array(
                      'pt_id' => (int) ($row['pt_id'] ?? 0),
                      'pt_code' => (string) ($row['pt_code'] ?? ''),
                      'name' => (string) ($row['pt_name'] ?? ''),
                      'statusCode' => (string) ($row['pt_status'] ?? ''),
                  );
              }
          }
          echo json_encode(array('ok' => true, 'count' => count($out), 'items' => $out), JSON_UNESCAPED_UNICODE);
          EOF
          REMOTE="/public_html/_audit_content_s2s_partners.php"
          curl --fail --show-error --silent --ftp-create-dirs \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            -T /tmp/audit_content_s2s_partners.php \
            "ftp://${FTP_SERVER}:${FTP_PORT}${REMOTE}"
          BASE=""
          for CAND in "https://onoffcpa.icrm.co.kr" "https://onoffcpa.iwinv.net"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "${CAND}/" || echo 000)
            if [ "$code" = "200" ]; then BASE="$CAND"; break; fi
          done
          [ -z "$BASE" ] && BASE="https://onoffcpa.icrm.co.kr"
          JSON=$(curl -sS --max-time 25 "${BASE}/_audit_content_s2s_partners.php" || echo '{"ok":false}')
          curl --silent --show-error \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            -Q "DELE ${REMOTE}" \
            "ftp://${FTP_SERVER}:${FTP_PORT}/" || true
          echo "$JSON" | tee /tmp/partners.json
          python3 -c "import json,sys;d=json.load(open('/tmp/partners.json')); sys.exit(0 if d.get('ok') and d.get('count',0)>0 else 1)" || {
            echo "::error::Partner audit failed: $(head -c 400 /tmp/partners.json)"
            exit 1
          }
          PT_ID=$(python3 -c "import json,os;d=json.load(open('/tmp/partners.json'));items=d.get('items') or [];want=int(os.environ.get('PT_INPUT','0') or '0');print(want if want>0 and want in {int(x.get('pt_id',0)) for x in items} else int(items[0].get('pt_id',0)))")
          PT_CODE=$(python3 -c "import json;d=json.load(open('/tmp/partners.json'));pt_id=int('$PT_ID');print(next((x.get('pt_code','') for x in d.get('items') or [] if int(x.get('pt_id',0))==pt_id),''))")
          echo "pt_id=$PT_ID" >> "$GITHUB_OUTPUT"
          echo "pt_code=$PT_CODE" >> "$GITHUB_OUTPUT"
          echo "Selected partner pt_id=$PT_ID code=$PT_CODE"

      - name: Generate credential and clients.local.php
        id: cred
        env:
          PT_ID: ${{ steps.partners.outputs.pt_id }}
        run: |
          set -euo pipefail
          KEY_ID="cnt_prod_$(openssl rand -hex 8)"
          SECRET="$(openssl rand -hex 32)"
          export KEY_ID SECRET
          python3 - <<'PY'
          import os
          from pathlib import Path
          key = os.environ["KEY_ID"]
          secret = os.environ["SECRET"]
          pt_id = int(os.environ["PT_ID"])
          php = """<?php
          /**
           * Content S2S machine clients — PRODUCTION (server-only, never commit).
           */
          return array(
              'maxSkewSeconds' => 300,
              'clients' => array(
                  array(
                      'name'   => 'content-bff-production',
                      'keyId'  => '%s',
                      'secret' => '%s',
                      'ptId'   => %d,
                      'status' => 'active',
                      'scopes' => array(
                          'content.campaigns.read',
                          'content.links.read',
                          'content.links.create',
                          'content.analytics.read',
                      ),
                  ),
              ),
          );
          """ % (key.replace("'", "\\'"), secret.replace("'", "\\'"), pt_id)
          Path(".provision/clients.local.php").write_text(php, encoding="utf-8")
          ht = "<Files \"clients.local.php\">\n  Require all denied\n</Files>\n"
          Path(".provision/content-api.htaccess").write_text(ht, encoding="utf-8")
          PY
          php -l .provision/clients.local.php
          umask 077
          {
            echo "ONOFFCPA_CONTENT_KEY=$KEY_ID"
            echo "ONOFFCPA_CONTENT_SECRET=$SECRET"
            echo "ONOFFCPA_S2S_ENABLED=true"
            echo "ONOFFCPA_BASE_URL=https://onoffcpa.icrm.co.kr"
            echo "ONOFFCPA_ALLOWED_HOSTS=onoffcpa.icrm.co.kr"
            echo "ONOFFCPA_LIVE_LINKS=false"
          } > .provision/bff-s2s.env
          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"
          {
            echo "### Content S2S credential provisioned"
            echo "- keyId: \`$KEY_ID\`"
            echo "- pt_id: $PT_ID"
            echo "- secret: *(Content BFF server only — not printed)*"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: FTP upload clients.local.php
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --ftp-create-dirs \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            -T .provision/clients.local.php \
            "ftp://${FTP_SERVER}:${FTP_PORT}/public_html/plugin/linkconnect/content-api/clients.local.php"
          curl --fail --show-error --silent --ftp-create-dirs \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            -T .provision/content-api.htaccess \
            "ftp://${FTP_SERVER}:${FTP_PORT}/public_html/plugin/linkconnect/content-api/.htaccess"

      - name: Direct S2S smoke + negative auth
        env:
          KEY_ID: ${{ steps.cred.outputs.key_id }}
        run: |
          set -euo pipefail
          SECRET="$(grep '^ONOFFCPA_CONTENT_SECRET=' .provision/bff-s2s.env | cut -d= -f2-)"
          export KEY_ID SECRET
          python3 - <<'PY'
          import hashlib, hmac, json, os, subprocess, time, uuid

          key = os.environ["KEY_ID"]
          secret = os.environ["SECRET"]
          base = "https://onoffcpa.icrm.co.kr"
          path = "/plugin/linkconnect/content-api/campaigns.php"

          def sign(method, path, ts, nonce, body):
              body_hash = hashlib.sha256(body.encode()).hexdigest()
              canonical = "\n".join([method.upper(), path, str(ts), nonce, body_hash])
              return hmac.new(secret.encode(), canonical.encode(), hashlib.sha256).hexdigest()

          def curl(method, path, headers=None):
              cmd = ["curl", "-sS", "-o", "/tmp/s2s_body", "-w", "%{http_code}", "-X", method, base + path]
              for k, v in (headers or {}).items():
                  cmd += ["-H", f"{k}: {v}"]
              code = subprocess.check_output(cmd, text=True).strip()
              body = open("/tmp/s2s_body").read()
              return code, body

          code, _ = curl("GET", path)
          assert code in ("401", "403"), f"missing headers expected 401/403 got {code}"

          ts = str(int(time.time()))
          nonce = uuid.uuid4().hex
          sig = sign("GET", path, ts, nonce, "")
          headers = {
              "Accept": "application/json",
              "X-LC-Content-Key": key,
              "X-LC-Content-Timestamp": ts,
              "X-LC-Content-Nonce": nonce,
              "X-LC-Content-Signature": sig,
          }
          code, body = curl("GET", path, headers)
          assert code == "200", f"valid GET expected 200 got {code}: {body[:200]}"
          data = json.loads(body)
          assert data.get("ok") is True, body[:200]
          assert "items" in (data.get("data") or {}), "missing items"

          bad_sig = sign("GET", path, ts, nonce + "x", "")
          headers["X-LC-Content-Signature"] = bad_sig
          code, _ = curl("GET", path, headers)
          assert code in ("401", "403"), f"bad signature expected 401/403 got {code}"

          old_ts = str(int(time.time()) - 9999)
          nonce2 = uuid.uuid4().hex
          sig2 = sign("GET", path, old_ts, nonce2, "")
          headers2 = dict(headers)
          headers2["X-LC-Content-Timestamp"] = old_ts
          headers2["X-LC-Content-Nonce"] = nonce2
          headers2["X-LC-Content-Signature"] = sig2
          code, _ = curl("GET", path, headers2)
          assert code in ("401", "403"), f"expired ts expected 401/403 got {code}"

          print("Direct S2S smoke PASS")
          PY

      - name: Configure Content BFF (SSH)
        env:
          SSH_KEY: ${{ secrets.CONTENT_BFF_SSH_KEY }}
          BFF_HOST: ${{ secrets.CONTENT_BFF_HOST }}
          BFF_USER: ${{ secrets.CONTENT_BFF_USER }}
        run: |
          set -euo pipefail
          missing=0
          [ -z "${SSH_KEY:-}" ] && echo "::warning::CONTENT_BFF_SSH_KEY missing — skip BFF env update" && missing=1
          [ -z "${BFF_HOST:-}" ] && echo "::warning::CONTENT_BFF_HOST missing — skip BFF env update" && missing=1
          [ "$missing" -eq 1 ] && exit 0
          USER="${BFF_USER:-root}"
          umask 077
          printf '%s' "$SSH_KEY" > /tmp/bff_deploy_key
          chmod 600 /tmp/bff_deploy_key
          scp -i /tmp/bff_deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            .provision/bff-s2s.env "${USER}@${BFF_HOST}:/tmp/onoffcpa-s2s.env.patch"
          ssh -i /tmp/bff_deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${USER}@${BFF_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ENV=/etc/content-icrm/bff-production.env
          TS=$(date +%Y%m%d-%H%M%S)
          cp -a "$ENV" "${ENV}.bak-${TS}"
          patch=/tmp/onoffcpa-s2s.env.patch
          for key in ONOFFCPA_CONTENT_KEY ONOFFCPA_CONTENT_SECRET ONOFFCPA_S2S_ENABLED ONOFFCPA_BASE_URL ONOFFCPA_ALLOWED_HOSTS ONOFFCPA_LIVE_LINKS; do
            sed -i "/^${key}=/d" "$ENV"
          done
          cat "$patch" >> "$ENV"
          chmod 640 "$ENV"
          chown root:www-data "$ENV"
          rm -f "$patch"
          systemctl restart content-icrm-bff.service
          systemctl is-active content-icrm-bff.service
          REMOTE
          rm -f /tmp/bff_deploy_key
