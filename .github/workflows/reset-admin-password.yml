name: Reset admin password (temp)

# 최고관리자(admin) 임시 비밀번호 재설정 + 로그인/권한 검증
# 실행 후 Actions 로그에 임시 비밀번호가 출력됩니다. 로그인 확인 후 즉시 변경하세요.
on:
  workflow_dispatch:

concurrency:
  group: onoffcpa-reset-admin-password
  cancel-in-progress: true

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reset admin password and verify login
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          TEMP_PASS="OnoffAdmin!$(date +%y%m%d%H%M)"
          echo "TEMP_PASS=$TEMP_PASS" >> "$GITHUB_ENV"

          cat > reset_admin_pw.php << EOF
          <?php
          header('Content-Type: application/json; charset=utf-8');
          error_reporting(E_ALL);
          ini_set('display_errors', '0');
          define('_GNUBOARD_', true);
          include_once __DIR__ . '/common.php';

          \$out = array('ok' => false);
          \$admin_id = isset(\$config['cf_admin']) ? trim((string) \$config['cf_admin']) : '';
          \$out['cfAdmin'] = \$admin_id;
          if (\$admin_id === '') {
              \$out['error'] = 'cf_admin empty';
              echo json_encode(\$out, JSON_UNESCAPED_UNICODE | JSON_PRETTY_PRINT);
              exit;
          }

          \$mb = get_member(\$admin_id);
          if (!\$mb || empty(\$mb['mb_id'])) {
              \$out['error'] = 'admin member missing';
              echo json_encode(\$out, JSON_UNESCAPED_UNICODE | JSON_PRETTY_PRINT);
              exit;
          }

          \$plain = '${TEMP_PASS}';
          if (!function_exists('get_encrypt_string')) {
              \$out['error'] = 'get_encrypt_string missing';
              echo json_encode(\$out, JSON_UNESCAPED_UNICODE | JSON_PRETTY_PRINT);
              exit;
          }
          \$hash = get_encrypt_string(\$plain);
          \$sql = " update {\$g5['member_table']}
                      set mb_password = '" . sql_escape_string(\$hash) . "',
                          mb_intercept_date = '',
                          mb_leave_date = ''
                    where mb_id = '" . sql_escape_string(\$admin_id) . "' ";
          sql_query(\$sql);

          \$mb2 = get_member(\$admin_id);
          \$check = function_exists('login_password_check')
              ? login_password_check(\$mb2, \$plain, \$mb2['mb_password'])
              : false;

          \$out['ok'] = (bool) \$check;
          \$out['passwordCheck'] = (bool) \$check;
          \$out['mbLevel'] = (int) (\$mb2['mb_level'] ?? 0);
          \$out['pwPrefix'] = substr((string) (\$mb2['mb_password'] ?? ''), 0, 4);
          \$out['message'] = \$check ? 'password reset ok' : 'password reset wrote but verify failed';
          echo json_encode(\$out, JSON_UNESCAPED_UNICODE | JSON_PRETTY_PRINT);
          EOF

          curl --fail --show-error --silent \
            --ftp-create-dirs \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            -T reset_admin_pw.php \
            "ftp://${FTP_SERVER}:${FTP_PORT}/public_html/_reset_admin_pw.php"

          echo "=== RESET RESULT ==="
          curl -sS "https://onoffcpa.icrm.co.kr/_reset_admin_pw.php"
          echo

          echo "=== LOGIN VERIFY ==="
          rm -f /tmp/admin_cj.txt
          curl -sS -c /tmp/admin_cj.txt -b /tmp/admin_cj.txt "https://onoffcpa.icrm.co.kr/bbs/login.php" -o /dev/null
          code=$(curl -sS -c /tmp/admin_cj.txt -b /tmp/admin_cj.txt -o /tmp/admin_login.html -w '%{http_code}' \
            -X POST "https://onoffcpa.icrm.co.kr/bbs/login_check.php" \
            --data-urlencode "mb_id=admin" \
            --data-urlencode "mb_password=${TEMP_PASS}" \
            --data-urlencode "url=/")
          echo "login_check_http=$code"
          # follow home auth
          curl -sS -c /tmp/admin_cj.txt -b /tmp/admin_cj.txt "https://onoffcpa.icrm.co.kr/" -o /tmp/admin_home.html
          python3 - <<'PY'
          import re, json
          html=open('/tmp/admin_home.html',encoding='utf-8',errors='replace').read()
          m=re.search(r'window\.__LC_AUTH__=(\{.*?\});', html)
          print('auth', m.group(1) if m else 'NONE')
          PY
          curl -sS -c /tmp/admin_cj.txt -b /tmp/admin_cj.txt "https://onoffcpa.icrm.co.kr/admin/" -o /tmp/admin_spa.html
          python3 - <<'PY'
          import re, json
          html=open('/tmp/admin_spa.html',encoding='utf-8',errors='replace').read()
          m=re.search(r'window\.__LC_AUTH__=(\{.*?\});', html)
          if not m:
            print('admin_auth NONE')
          else:
            d=json.loads(m.group(1))
            print('admin_auth', {k:d.get(k) for k in ['loggedIn','isSuperAdmin','canAccessAdmin','memberId','mb_level'] if True})
            print('keys', sorted([k for k in d.keys() if 'Admin' in k or 'logged' in k or 'member' in k]))
          PY

          echo "=== TEMP PASSWORD (change after login) ==="
          echo "$TEMP_PASS"

          curl --silent --show-error \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            -Q "DELE /public_html/_reset_admin_pw.php" \
            "ftp://${FTP_SERVER}:${FTP_PORT}/" || true
