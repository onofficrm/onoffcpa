name: Reset admin password (cpaadmin)

# 최고관리자(cpaadmin) 계정 보장 + 비밀번호 재설정 + 로그인/권한 검증
# 실행 후 Actions 로그에 비밀번호가 출력됩니다.
on:
  workflow_dispatch:

concurrency:
  group: onoffcpa-reset-admin-password
  cancel-in-progress: true

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ensure cpaadmin superadmin and verify login
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          ADMIN_ID="cpaadmin"
          TEMP_PASS='a123456@'
          echo "ADMIN_ID=$ADMIN_ID" >> "$GITHUB_ENV"
          echo "TEMP_PASS=$TEMP_PASS" >> "$GITHUB_ENV"

          cat > reset_admin_pw.php << EOF
          <?php
          header('Content-Type: application/json; charset=utf-8');
          error_reporting(E_ALL);
          ini_set('display_errors', '0');
          define('_GNUBOARD_', true);
          include_once __DIR__ . '/common.php';

          \$out = array('ok' => false);
          \$admin_id = 'cpaadmin';
          \$plain = '${TEMP_PASS}';
          \$now = G5_TIME_YMDHIS;
          \$member_table = \$g5['member_table'];
          \$config_table = \$g5['config_table'];

          if (!function_exists('get_encrypt_string')) {
              \$out['error'] = 'get_encrypt_string missing';
              echo json_encode(\$out, JSON_UNESCAPED_UNICODE | JSON_PRETTY_PRINT);
              exit;
          }

          \$hash = get_encrypt_string(\$plain);
          \$mb = get_member(\$admin_id);
          \$created = false;
          if (!\$mb || empty(\$mb['mb_id'])) {
              \$nick = 'CPA관리자';
              \$sql = " INSERT INTO \`{\$member_table}\` SET
                  mb_id = '" . sql_escape_string(\$admin_id) . "',
                  mb_password = '" . sql_escape_string(\$hash) . "',
                  mb_name = '" . sql_escape_string(\$nick) . "',
                  mb_nick = '" . sql_escape_string(\$nick) . "',
                  mb_nick_date = '" . sql_escape_string(G5_TIME_YMD) . "',
                  mb_email = 'cpaadmin@onoffcpa.icrm.co.kr',
                  mb_homepage = '',
                  mb_level = 10,
                  mb_sex = '',
                  mb_signature = '',
                  mb_memo = '',
                  mb_lost_certify = '',
                  mb_mailling = 0,
                  mb_sms = 0,
                  mb_open = 0,
                  mb_open_date = '" . sql_escape_string(G5_TIME_YMD) . "',
                  mb_profile = '',
                  mb_today_login = '" . sql_escape_string(\$now) . "',
                  mb_datetime = '" . sql_escape_string(\$now) . "',
                  mb_ip = '" . sql_escape_string(\$_SERVER['REMOTE_ADDR'] ?? '') . "',
                  mb_leave_date = '',
                  mb_intercept_date = '',
                  mb_email_certify = '" . sql_escape_string(\$now) . "',
                  mb_memo_call = '',
                  mb_1 = '', mb_2 = '', mb_3 = '', mb_4 = '', mb_5 = '',
                  mb_6 = '', mb_7 = '', mb_8 = '', mb_9 = '', mb_10 = '' ";
              sql_query(\$sql);
              \$created = true;
          } else {
              \$sql = " UPDATE \`{\$member_table}\` SET
                  mb_password = '" . sql_escape_string(\$hash) . "',
                  mb_level = 10,
                  mb_intercept_date = '',
                  mb_leave_date = ''
                WHERE mb_id = '" . sql_escape_string(\$admin_id) . "' ";
              sql_query(\$sql);
          }

          sql_query(" UPDATE \`{\$config_table}\` SET cf_admin = '" . sql_escape_string(\$admin_id) . "' ");

          \$mb2 = get_member(\$admin_id);
          \$check = function_exists('login_password_check')
              ? login_password_check(\$mb2, \$plain, \$mb2['mb_password'])
              : false;
          \$cfg = sql_fetch(" SELECT cf_admin FROM \`{\$config_table}\` LIMIT 1 ");

          \$out['ok'] = (bool) \$check && ((string) (\$cfg['cf_admin'] ?? '') === \$admin_id);
          \$out['created'] = \$created;
          \$out['cfAdmin'] = (string) (\$cfg['cf_admin'] ?? '');
          \$out['mbId'] = (string) (\$mb2['mb_id'] ?? '');
          \$out['mbLevel'] = (int) (\$mb2['mb_level'] ?? 0);
          \$out['passwordCheck'] = (bool) \$check;
          \$out['pwPrefix'] = substr((string) (\$mb2['mb_password'] ?? ''), 0, 4);
          \$out['message'] = \$out['ok'] ? 'cpaadmin superadmin ready' : 'setup incomplete';
          echo json_encode(\$out, JSON_UNESCAPED_UNICODE | JSON_PRETTY_PRINT);
          EOF

          curl --fail --show-error --silent \
            --ftp-create-dirs \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            -T reset_admin_pw.php \
            "ftp://${FTP_SERVER}:${FTP_PORT}/public_html/_reset_admin_pw.php"

          echo "=== RESET RESULT ==="
          curl -sS "https://onoffcpa.icrm.co.kr/_reset_admin_pw.php"
          echo

          echo "=== LOGIN VERIFY ==="
          rm -f /tmp/admin_cj.txt
          curl -sS -c /tmp/admin_cj.txt -b /tmp/admin_cj.txt "https://onoffcpa.icrm.co.kr/bbs/login.php" -o /dev/null
          code=$(curl -sS -c /tmp/admin_cj.txt -b /tmp/admin_cj.txt -o /tmp/admin_login.html -w '%{http_code}' \
            -X POST "https://onoffcpa.icrm.co.kr/bbs/login_check.php" \
            --data-urlencode "mb_id=${ADMIN_ID}" \
            --data-urlencode "mb_password=${TEMP_PASS}" \
            --data-urlencode "url=/")
          echo "login_check_http=$code"
          curl -sS -c /tmp/admin_cj.txt -b /tmp/admin_cj.txt "https://onoffcpa.icrm.co.kr/" -o /tmp/admin_home.html
          python3 - <<'PY'
          import re, json
          html=open('/tmp/admin_home.html',encoding='utf-8',errors='replace').read()
          m=re.search(r'window\.__LC_AUTH__=(\{.*?\});', html)
          if not m:
            print('auth NONE')
          else:
            d=json.loads(m.group(1))
            print('auth', {k:d.get(k) for k in ['loggedIn','isSuperAdmin','canAccessAdmin','memberId','mb_level']})
          PY
          curl -sS -c /tmp/admin_cj.txt -b /tmp/admin_cj.txt "https://onoffcpa.icrm.co.kr/admin/" -o /tmp/admin_spa.html
          python3 - <<'PY'
          import re, json
          html=open('/tmp/admin_spa.html',encoding='utf-8',errors='replace').read()
          m=re.search(r'window\.__LC_AUTH__=(\{.*?\});', html)
          if not m:
            print('admin_auth NONE')
          else:
            d=json.loads(m.group(1))
            print('admin_auth', {k:d.get(k) for k in ['loggedIn','isSuperAdmin','canAccessAdmin','memberId','mb_level']})
          PY

          echo "=== ADMIN CREDENTIALS ==="
          echo "id=$ADMIN_ID"
          echo "password=$TEMP_PASS"

          curl --silent --show-error \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            -Q "DELE /public_html/_reset_admin_pw.php" \
            "ftp://${FTP_SERVER}:${FTP_PORT}/" || true
